page:index|LiDroid Guide
LiDroid runs a small Linux virtual machine on your Android phone and gives you rootless [[packages|Podman containers]] inside it: a complete Debian 13 (aarch64) userland, with no root required on the phone.

This directory is the offline copy of the guide, baked into the VM image. Read it from any browser, even with no network:

```
lidroid-docs                        # in a LiDroid terminal: serves this guide
lidroid-forward add 9980 9980 tcp   # expose it to the phone
# then open http://127.0.0.1:9980
```

Start with [[getting-started]]. [[backends]] explains which engine your VM is running and why it may differ from what you picked; [[desktop]] covers the graphical display; [[networking]] the reachability model; [[settings]] is a reference for every switch in the app; and [[how-it-works]] describes the architecture if you are curious what actually happens when you press Start.

page:getting-started|Getting Started
## The setup wizard
The first launch walks through five pages, all changeable later in [[settings]]:

- Persistent storage — the size of the VM's disk image. It can be grown later, never shrunk.
- VM resources — RAM, CPUs, and a bandwidth cap. Load balance picks sensible values from the device automatically.
- SSH access — enabled by default; exposes the VM's root shell on the phone (see below).
- Downloads sharing — mounts the phone's Downloads folder into the VM over 9p ([[packages]] has the paths).
- USB passthrough — QEMU-only; adds a USB controller so devices can be attached later.
- Permissions — notifications and battery-optimization exemption, so the VM is not killed mid-boot.

## Starting and stopping
Press Start on the home screen. The status card follows the boot progress; the first boot also resizes and migrates the storage image. Stop shuts the VM down cleanly — containers keep running across restarts, they live on the VM's disk.

## Your first container
Open Terminal from the home screen. You get a root shell inside the VM (the phone itself is never rooted):

```
podman run --rm alpine echo hello from LiDroid
```

## Shell access from a PC
With SSH enabled (default), the VM's root shell is forwarded to port 9922 on the phone:

```
ssh root@<phone-ip> -p 9922
# password: lidroid
```

Change it right away with `passwd`. The phone's IP is shown in Settings → Network. This port is deliberately reachable from the LAN — see the reserved-port note in [[networking]].

page:backends|Backends: AVF and QEMU
## The two engines
- QEMU (TCG) — pure emulation, runs on every device. Slower, but universal, and the only backend with USB passthrough.
- AVF (KVM) — the Android Virtualization Framework. Near-native speed on devices that ship it, and the reason the "Auto" engine exists.

## How Auto picks
Auto selects AVF when the device actually supports it, otherwise QEMU. Two situations force a fallback even when AVF was picked, and the app shows a banner explaining why:

- The device's virtualization service has networking turned off — LiDroid falls back to QEMU so the VM stays online.
- The AVF manage permission has not been granted yet. It needs a PC with adb, or the Shizuku app for an on-device grant; the home screen hint shows the exact command.

## Choosing manually
Settings → Advanced → Engine lets you pin AUTO, AVF, or QEMU while the VM is stopped. Pinning AVF on a device that cannot run it is annotated, not blocked — grant the permission later and it starts working.

Settings → About → AVF diagnostic runs a live probe and smoke test and shows the full report.

page:desktop|The X11 Desktop
## Opening it
From the terminal toolbar, open the desktop. The guest runs Xvnc (display :0) plus PulseAudio; the in-app viewer streams both, so nothing needs to be forwarded manually.

## Resolution
- Match viewport — the desktop follows your screen, with a render scale of 100%, 75%, or 50%.
- Preset — fixed 720p / 900p / 1080p / 1440p.
- Custom — width/height you type (applied immediately).

## Input and display
Rotation lock (auto / landscape / portrait), touch mode (direct touch, or trackpad with pointer speed and acceleration), the extra-keys row, and the per-boot DPI are all in the viewer's settings sheet. DPI is read by the guest at VM start, so it applies on the next boot.

## Audio
PulseAudio listens on TCP 4713 inside the guest; the viewer routes it to the phone. Ports 5900 (display) and 4713 (audio) are owned by the in-app desktop — see [[networking]] before trying to forward them yourself.

page:networking|Networking
## The model
The guest's network is user-mode (slirp): everything outbound just works, and inbound reaches the VM only through explicit port forwards. The VM is not exposed on the LAN except where stated below.

## Phone IP and SSH
Settings → Network shows the phone's IP (plus any second interface, e.g. tethering). With SSH enabled, forward your own way in:

```
ssh root@<phone-ip> -p 9922    # password: lidroid
```

Port 9922 is intentionally LAN-reachable — it is the one deliberate exception to the rule below. Turn SSH off if you do not want it.

## Port forwards
Settings → Network → Add creates rules (tcp, udp, or both, phone port → VM port). Rules are pushed to the guest at boot and updated live at runtime; the list survives restarts.

Two ports are reserved and refused as user rules: 5900 (the X11 display stream) and 4713 (audio). They bind on all interfaces for the in-app viewer; a user rule shadowing them would expose the unauthenticated X session to the whole LAN.

## Limits and DNS
The bandwidth cap (Settings → VM resources, 0 = unlimited) shapes guest traffic. DNS starts at the built-in resolver (10.0.2.3) and is rewritten with the real DHCP-provided resolver once the network is up.

page:packages|Packages and Podman
## Rootless Podman
The VM ships Debian 13 with Podman, fully rootless: containers run as a normal user with no more privileges than any Linux process. The usual workflow applies:

```
podman search alpine
podman pull alpine
podman run -it --rm alpine sh
podman ps -a
```

Images and container storage live inside the VM's disk image — they survive VM restarts and app restarts, and are wiped only by Reset VM ([[limitations]]).

## Moving data in and out
With [[getting-started|Downloads sharing]] on, the phone's Downloads folder is mounted at /mnt/downloads. The Container backup screen (Settings → Storage) builds ready-made `docker cp` / `podman save` commands, and `lidroid-backup` writes tar archives to:

- /mnt/downloads/LiDroid/backups — with Downloads sharing enabled
- /var/backups/lidroid — otherwise

Paste the generated commands into the LiDroid terminal; older guest images without lidroid-backup fall back to `podman export` automatically.

page:performance|Performance Tuning
## Load balance
Leave Load balance on unless you have a specific reason: it reads the device's real RAM, CPU count, free storage, and picks a profile that keeps the VM comfortable next to Android itself.

## Choosing by hand
- RAM — 512 MB boots a minimal system; container-heavy work wants more. The value is what the VM sees, taken from what the phone can spare.
- CPUs — 2 vCPUs let multi-threaded TCG actually schedule across host threads; single-threaded translation ignores the extra core, but Node, builds, and image extraction all benefit.
- Storage — grows on demand; shrinking is refused.
- Bandwidth — a hard ceiling on guest traffic; image pulls are the first thing to feel it.

## Engine
AVF (KVM) is an order of magnitude faster than QEMU (TCG) where the device supports it — see [[backends]]. Long-running jobs are happiest with [[settings|server mode]] keeping the VM alive without a bright screen.

page:settings|Settings Reference
## Language
App language, independent of the VM's locale.

## VM resources
Stop the VM to change any of these: load balance, RAM, CPUs, bandwidth cap, and storage size (grow-only). Autostart on boot brings the VM up when the phone starts; automation apps can also trigger the intent actions com.abhiram.lidroid.action.START_VM and STOP_VM.

## Network
Phone IP (read-only), the SSH switch, and the port-forward table with its 2048-rule ceiling — see [[networking]] for the reserved ports.

## Storage
- Downloads sharing — toggles the 9p share; on Android 11+ it jumps to the system all-files-access screen. Some devices crash the VM with it on; disable if start fails.
- Container backup — command builder and the on-phone backup list ([[packages]]).
- USB passthrough — QEMU-only, asked per device at attach time.
- Reset VM — destructive: wipes containers, images, and the storage image.

## Advanced
Engine selection with the current-fallback annotation, plus raw escape hatches: extra QEMU args and an extra kernel cmdline. Both persist, apply to the next start, and can be reset individually.

## About
Version, QEMU version, architecture, distro, the online documentation, a diagnostic-log export, AVF verbose logging, and the AVF diagnostic.

page:how-it-works|How It Works
## The three artifacts
The app ships (and rebuilds via Docker) three pieces:

- vmlinuz-virt — a minimal Linux kernel, virt-configured, built for ARM64.
- initrd.img — a tiny initramfs that assembles the boot.
- debian-rootfs.squashfs — the full Debian 13 rootfs: OpenRC, Podman, Xvnc, PulseAudio, and the guest tools.

## One boot
Pressing Start launches the VM on the chosen [[backends|engine]], attaches the storage image, and wires the console to the app through virtio-serial (the terminal's resize messages ride a second channel). OpenRC then brings up the guest in order: bootstrap → network → downloads share → vsock → hostd → X11 → ready.

## The bridge
Port forwards never touch the phone's network stack: a small host daemon (lidroid-hostd) splices phone TCP ports to vsock channels that the in-guest agent (lidroid-vsock-agent) bridges to local sockets. The same control channel carries ADD/REMOVE for rules added at runtime; /etc/lidroid/forwards.conf is just the seed table. lidroid-forward is a symlink to the same daemon.

The static binaries (musl-built, no libc compat needed) are lidroid-hostd, lidroid-vsock-agent, and lidroid-overlay-normalize, plus the shell tools: lidroid-docs, lidroid-backup, lidroid-resize, lidroid-getty, lidroid-login.

## Upgrades
The rootfs carries a system version; on boot, lidroid-migrate applies any pending migrations from /etc/lidroid/migrations/. Container data lives on the storage image, which survives rootfs replacement.

page:limitations|Limitations
- No root on the phone — by design. Containers are rootless; the phone stays stock.
- QEMU (TCG) is emulation. It is the fallback everywhere, but it is much slower than AVF/KVM on supported devices.
- Downloads sharing can crash the VM on some devices (the toggle warns about this). USB passthrough is QEMU-only.
- All-files access needs Android 11+; older versions fall back to the legacy storage permission.
- Storage grows but never shrinks; Reset VM is the only way back.
- AVF's networking is disabled on some devices' virtualization service — Auto falls back to QEMU to keep the VM online.
- The VM lives only as long as the app keeps it alive. Server mode holds the foreground with the screen blacked out specifically so Android does not kill it (exit: press and hold anywhere for 3 seconds).
