# LiDroid CI Build
# Builds (kernel + initramfs → Debian rootfs squashfs → QEMU + JNI libs → APK) 
name: LiDroid build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build App
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

       # Build Rootfs  
      - name: Set up QEMU (arm64 emulation for the Debian rootfs stage)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run build File
        run: |
          chmod +x build-all.sh gradlew
          ./build-all.sh all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiDroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
